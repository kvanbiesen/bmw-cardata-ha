name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  # Run by the Autorelease workflow before it releases.
  workflow_call:

# The action follows a branch and runs a container image over the checkout,
# so it gets a token that only reads and no credentials left in the clone.
permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Home Assistant needs 3.14 since 2026.3; on 3.13 pip falls back to
          # 2026.2 and the tests run against a release users left long ago.
          python-version: "3.14"

      - name: Install Home Assistant test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component paho-mqtt

      # Named individually rather than running the whole directory: the stream
      # and coordinator tests still call a pre-refactor API and fail, so a bare
      # "pytest tests/" would be red from the start. Add files here as they are
      # brought back into line.
      - name: Run unit and mocked setup tests
        env:
          PYTHONPATH: "."
        run: pytest -q tests/test_charging_history_restore.py tests/test_config_flow.py tests/test_soc_wiring.py tests/test_soc_phase_inference.py tests/test_opening_binary_sensors.py tests/test_sensor_classes.py tests/test_charging_energy.py tests/test_mileage_guard.py tests/test_button_restore.py tests/test_number_capacity.py tests/test_stream_retry.py tests/test_container_id.py tests/test_condition_based_services.py tests/test_cbs_container.py tests/test_fault_memory.py

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 --ignore=E501,W503,E203 custom_components/cardata

      - name: Run ruff linter (auto-fix)
        if: github.event_name == 'push'
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix"
          src: "custom_components/cardata"

      - name: Run ruff linter (check)
        if: github.event_name == 'pull_request'
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "custom_components/cardata"

      - name: Run ruff formatter (auto-fix)
        if: github.event_name == 'push'
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"
          src: "custom_components/cardata"

      - name: Run ruff formatter check
        if: github.event_name == 'pull_request'
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "custom_components/cardata"

      - name: Commit ruff fixes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ruff autofix"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy --namespace-packages --explicit-package-bases --ignore-missing-imports custom_components/cardata

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile all
        run: python -m compileall custom_components/cardata

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Pinned to 3.11 to match the fuzzing workflow: atheris has no wheel for
      # 3.13, so the version the other jobs use cannot install it.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-fuzz.txt

      - name: Install fuzzing dependencies
        run: pip install -r requirements-fuzz.txt

      # The nightly fuzzing only notices a broken harness at 01:00, and a
      # harness that dies at import wastes a whole matrix job. Import each one
      # here instead. The glob must match the one the fuzzing workflow uses to
      # build its matrix. run_name keeps main() from starting a real fuzz run,
      # and each harness needs its own process because the homeassistant stub
      # installers skip their work when the module is already imported.
      - name: Import every fuzz harness
        run: |
          status=0
          for harness in fuzz/fuzz_*.py; do
            echo "== $harness"
            python -c "import runpy, sys; runpy.run_path(sys.argv[1], run_name='smoke')" "$harness" || status=1
          done
          exit $status

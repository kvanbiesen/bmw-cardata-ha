name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 --ignore=E501,W503,E203 custom_components/cardata

      - name: Run ruff linter (auto-fix)
        if: github.event_name == 'push'
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix"
          src: "custom_components/cardata"

      - name: Run ruff linter (check)
        if: github.event_name == 'pull_request'
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "custom_components/cardata"

      - name: Run ruff formatter (auto-fix)
        if: github.event_name == 'push'
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"
          src: "custom_components/cardata"

      - name: Run ruff formatter check
        if: github.event_name == 'pull_request'
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "custom_components/cardata"

      - name: Commit ruff fixes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ruff autofix"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy --namespace-packages --explicit-package-bases --ignore-missing-imports custom_components/cardata

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile all
        run: python -m compileall custom_components/cardata

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Pinned to 3.11 to match the fuzzing workflow: atheris has no wheel for
      # 3.13, so the version the other jobs use cannot install it.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-fuzz.txt

      - name: Install fuzzing dependencies
        run: pip install -r requirements-fuzz.txt

      # The nightly fuzzing only notices a broken harness at 01:00, and a
      # harness that dies wastes a whole matrix job. Give each one a five
      # second run here instead. Importing alone used to be enough for the
      # stale homeassistant stubs, but it leaves TestOneInput uncalled, so a
      # harness reaching for production code that has since been deleted still
      # got through. The glob must match the one the fuzzing workflow uses to
      # build its matrix, FUZZ_MAX_TIME is the budget every harness reads, and
      # -timeout mirrors the nightly so one slow input cannot stall the job.
      - name: Fuzz every harness briefly
        env:
          FUZZ_MAX_TIME: "5"
        run: |
          status=0
          for harness in fuzz/fuzz_*.py; do
            echo "== $harness"
            python "$harness" -timeout=30 || status=1
          done
          exit $status
